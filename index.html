<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Nerogate | Monero in. Real-world assets out.</title>
    <meta
      name="description"

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://nerogate.org/" />
    <meta name="theme-color" content="#0b0907" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Nerogate" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nerogate" />
    <meta property="og:url" content="https://nerogate.org/" />
    <meta property="og:title" content="Nerogate | Monero in. Real-world assets out." />
    <meta
      property="og:description"
      content="The private on-ramp to tokenized stocks, ETFs and gold on Solana. Pay with XMR from any wallet, hold it yourself."
    />
    <meta property="og:image" content="https://nerogate.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nerogate: Monero in. Real-world assets out." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Nerogate_" />
    <meta name="twitter:title" content="Nerogate | Monero in. Real-world assets out." />
    <meta
      name="twitter:description"
      content="The private on-ramp to tokenized stocks, ETFs and gold on Solana. Pay with XMR from any wallet, hold it yourself."
    />
    <meta name="twitter:image" content="https://nerogate.org/og-image.png" />
    <meta name="twitter:image:alt" content="Nerogate: Monero in. Real-world assets out." />

    <!-- Connections the app makes early -->
    <link rel="preconnect" href="https://lite-api.jup.ag" crossorigin />
    <link rel="preconnect" href="https://exolix.com" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://nerogate.org/#org",
            "name": "Nerogate",
            "url": "https://nerogate.org/",
            "logo": "https://nerogate.org/icon-512.png",
            "sameAs": ["https://x.com/Nerogate_"]
          },
          {
            "@type": "WebSite",
            "@id": "https://nerogate.org/#website",
            "url": "https://nerogate.org/",
            "name": "Nerogate",
            "description": "The private on-ramp from Monero to tokenized stocks, ETFs and gold on Solana.",
            "publisher": { "@id": "https://nerogate.org/#org" },
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "name": "Nerogate App",
            "url": "https://nerogate.org/app",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "description": "Swap XMR into tokenized stocks, ETFs, gold, USDC or SOL that settle to your own Solana wallet.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "publisher": { "@id": "https://nerogate.org/#org" }
          }
        ]
      }
